<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clicker Pro</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --main-color: #ffaa00;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; /* Запрет выделения текста */
        }

        /* Верхняя панель (Энергия) */
        .top-bar {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .energy-container {
            width: 80%;
            background: #2a2a35;
            border-radius: 10px;
            height: 20px;
            position: relative;
            overflow: hidden;
        }

        .energy-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ffaa00, #ffdd00);
            transition: width 0.3s ease;
        }

        .energy-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: bold;
            color: #000;
        }

        /* Счетчик монет */
        .score-container {
            margin-top: 20px;
            text-align: center;
        }

        .score-title {
            font-size: 16px;
            color: #888;
            margin-bottom: 5px;
        }

        .score {
            font-size: 48px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .coin-icon {
            width: 40px;
            height: 40px;
            background: gold;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 15px gold;
        }

        /* Главная кнопка (Кнопка-хомяк) */
        .click-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .click-btn {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #3a3a45, #1e1e24);
            border: 4px solid var(--main-color);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.3);
            transition: transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px; /* Сюда можно вставить эмодзи или картинку */
        }

        /* Анимация нажатия */
        .click-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 50px rgba(255, 170, 0, 0.6);
        }

        /* Всплывающие цифры (+1) */
        .floating-text {
            position: absolute;
            color: white;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }

        /* Нижнее меню (Заглушки) */
        .bottom-menu {
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            background: #1e1e24;
            border-top: 1px solid #333;
        }

        .menu-item {
            text-align: center;
            font-size: 12px;
            color: #888;
            cursor: pointer;
        }
        
        .menu-item.active {
            color: var(--main-color);
        }
    </style>
</head>
<body>

    <!-- Энергия -->
    <div class="top-bar">
        <div class="energy-container">
            <div class="energy-bar" id="energyBar"></div>
            <div class="energy-text" id="energyText">1000 / 1000</div>
        </div>
    </div>

    <!-- Монеты -->
    <div class="score-container">
        <div class="score-title">Заработано монет</div>
        <div class="score">
            <div class="coin-icon"></div>
            <span id="score">0</span>
        </div>
    </div>

    <!-- Игровое поле -->
    <div class="click-area" id="clickArea">
        <button class="click-btn" id="clickBtn">
            👆
        </button>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-menu">
        <div class="menu-item active">Тапать</div>
        <div class="menu-item">Апгрейды</div>
        <div class="menu-item">Друзья</div>
    </div>

    <script>
        // --- ДАННЫЕ ИГРЫ ---
        let score = localStorage.getItem('clickerScore') ? parseInt(localStorage.getItem('clickerScore')) : 0;
        let maxEnergy = 1000;
        let energy = maxEnergy;
        let clickPower = 1; // Сколько монет за клик
        let energyCost = 10; // Сколько энергии тратится за клик

        // Элементы на странице
        const scoreEl = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');
        const clickArea = document.getElementById('clickArea');
        const energyBar = document.getElementById('energyBar');
        const energyText = document.getElementById('energyText');

        // Обновляем интерфейс при старте
        scoreEl.innerText = score;
        updateEnergy();

        // --- ЛОГИКА КЛИКА ---
        clickBtn.addEventListener('click', (e) => {
            if (energy >= energyCost) {
                // Вычитаем энергию, добавляем монеты
                energy -= energyCost;
                score += clickPower;

                // Сохраняем в память
                localStorage.setItem('clickerScore', score);

                // Обновляем текст
                scoreEl.innerText = score;
                updateEnergy();

                // Создаем всплывающий текст "+1"
                createFloatingText(e.clientX, e.clientY);

            } else {
                // Если энергия кончилась
                clickBtn.style.borderColor = "#ff0000";
                setTimeout(() => clickBtn.style.borderColor = "var(--main-color)", 500);
            }
        });

        // --- ВОССТАНОВЛЕНИЕ ЭНЕРГИИ ---
        // Каждые 1.5 секунды восстанавливаем 10 энергии (бесконечный цикл)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 5;
                if (energy > maxEnergy) energy = maxEnergy;
                updateEnergy();
            }
        }, 1000);

        // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
        function updateEnergy() {
            const percent = (energy / maxEnergy) * 100;
            energyBar.style.width = percent + '%';
            energyText.innerText = `${energy} / ${maxEnergy}`;
        }

        function createFloatingText(x, y) {
            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = `+${clickPower}`;
            text.style.left = x + 'px';
            text.style.top = y + 'px';
            // Небольшой разброс, чтобы цифры не спавнились в одну точку
            text.style.transform = `translate(${Math.random() * 40 - 20}px, ${Math.random() * 40 - 20}px)`;
            
            document.body.appendChild(text);
            
            // Удаляем элемент через 1 секунду (после анимации)
            setTimeout(() => text.remove(), 1000);
        }
    </script>
</body>
</html>
