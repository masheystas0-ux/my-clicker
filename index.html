<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-Игра: Кейсы</title>
    <style>
        /* Базовые стили, чтобы было похоже на мобильное приложение */
        body {
            background-color: #1a1a24;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a35;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .balance {
            color: #00ff00;
            font-weight: bold;
            font-size: 20px;
        }

        .btn {
            background: #5a4bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #7a6bff;
        }

        /* Контейнер для рулетки */
        .roulette-container {
            width: 100%;
            max-width: 400px;
            height: 120px;
            background: #2a2a35;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
            border: 2px solid #5a4bff;
            display: flex;
            align-items: center;
        }

        /* Сама лента с предметами */
        .roulette-strip {
            display: flex;
            transition: transform 3s cubic-bezier(0.1, 1, 0.1, 1); /* Плавная остановка */
        }

        /* Один предмет в рулетке */
        .item {
            width: 100px;
            height: 100px;
            margin: 0 5px;
            background: #3a3a45;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            flex-shrink: 0;
        }

        /* Указатель посередине */
        .pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: red;
            z-index: 10;
            box-shadow: 0 0 10px red;
        }

        /* Кнопки действий */
        .actions {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .action-btn {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .spin-btn { background: #ff8c00; }
        .upgrade-btn { background: #ff0055; }

        .result-text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>

    <!-- Шапка с балансом -->
    <div class="header">
        <div>Баланс:</div>
        <div class="balance" id="balance">1000 🪙</div>
        <button class="btn" onclick="addCoins()">+100 🪙</button>
    </div>

    <!-- Рулетка -->
    <div class="roulette-container">
        <div class="pointer"></div>
        <div class="roulette-strip" id="strip">
            <!-- Сюда JS будет добавлять предметы -->
        </div>
    </div>

    <!-- Кнопки -->
    <div class="actions">
        <button class="action-btn upgrade-btn" onclick="spin(500, 2, 'Апгрейд')">Апгрейд (x2)</button>
        <button class="action-btn spin-btn" onclick="spin(100, 1, 'Шторм')">Шторм</button>
    </div>

    <div class="result-text" id="result">Крути рулетку!</div>

    <script>
        let balance = 1000;
        const strip = document.getElementById('strip');
        const balanceEl = document.getElementById('balance');
        const resultEl = document.getElementById('result');

        // Возможные выигрыши в рулетке (эмодзи для простоты)
        const items = ['💎', '🔫', '🍕', '👑', '🐸', '⭐', '💣'];
        let currentPosition = 0;

        // Функция для добавления монет (имитация "заработка" в игре)
        function addCoins() {
            balance += 100;
            updateBalance();
        }

        function updateBalance() {
            balanceEl.innerText = balance + ' 🪙';
        }

        // Функция генерации ленты для визуала
        function generateStrip() {
            strip.innerHTML = '';
            // Генерируем 50 предметов для длинной ленты
            for (let i = 0; i < 50; i++) {
                const randomItem = items[Math.floor(Math.random() * items.length)];
                const div = document.createElement('div');
                div.className = 'item';
                div.innerText = randomItem;
                strip.appendChild(div);
            }
        }

        // Основная логика кручения
        function spin(cost, multiplier, gameName) {
            if (balance < cost) {
                resultEl.innerText = "Недостаточно монет!";
                resultEl.style.color = "#ff4444";
                return;
            }

            balance -= cost;
            updateBalance();
            resultEl.innerText = "Крутим...";
            resultEl.style.color = "white";

            // 1. Сбрасываем позицию (чтобы анимация сработала заново)
            strip.style.transition = 'none';
            strip.style.transform = 'translateX(0px)';
            currentPosition = 0;

            // Генерируем новую ленту
            generateStrip();

            // 2. Ждем малую долю секунды, чтобы браузер применил сброс
            setTimeout(() => {
                strip.style.transition = 'transform 4s cubic-bezier(0.1, 1, 0.1, 1)'; // Возвращаем анимацию

                // Выбираем случайный индекс для остановки (от 20 до 30)
                // Нам нужно остановиться так, чтобы элемент был ровно под указателем
                const stopIndex = Math.floor(Math.random() * 10) + 20; 
                
                // Расчет смещения: 1 элемент = 110px (100 ширина + 10 отступы)
                // Центр экрана - это половина контейнера.
                // Чтобы предмет встал под указатель, нам нужно прокрутить ленту.
                const itemWidth = 110;
                const containerWidth = document.querySelector('.roulette-container').offsetWidth;
                const centerOffset = (containerWidth / 2) - (itemWidth / 2); // Смещение для центровки первого элемента
                
                // Итоговое смещение: (индекс * ширина) - центровка + случайный разброс внутри предмета
                const randomOffsetInItem = (Math.random() * 60) - 30; // От -30 до +30 px
                const translateX = -((stopIndex * itemWidth) - centerOffset + randomOffsetInItem);

                strip.style.transform = `translateX(${translateX}px)`;

                // 3. Выдаем результат после окончания анимации
                setTimeout(() => {
                    // Логика выигрыша (простая математика для примера)
                    // Если "Апгрейд", шанс 40% на удвоение
                    let isWin = false;
                    if (gameName === 'Апгрейд') {
                        isWin = Math.random() < 0.4; // 40% шанс
                    } else {
                        isWin = Math.random() < 0.6; // 60% шанс для Шторма
                    }

                    if (isWin) {
                        const winAmount = cost * multiplier;
                        balance += winAmount;
                        resultEl.innerText = `Победа! Вы выиграли ${winAmount} 🪙`;
                        resultEl.style.color = "#00ff00";
                    } else {
                        resultEl.innerText = `Проигрыш... Вы потеряли ${cost} 🪙`;
                        resultEl.style.color = "#ff4444";
                    }
                    updateBalance();
                }, 4000); // 4000 мс = время анимации (4s)

            }, 50);
        }

        // Инициализация при загрузке
        generateStrip();
    </script>
</body>
</html>
