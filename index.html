
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Clicker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #10152d, #25205b);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px 15px;
}

.container {
    max-width: 420px;
    margin: auto;
    background: #1b2145;
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 10px 40px #0008;
}

h1 {
    color: #ffd54a;
    font-size: 32px;
}

.balance {
    font-size: 30px;
    font-weight: bold;
    margin: 25px;
    color: #ffd54a;
}

.coin {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    border: 8px solid #ffeb8a;
    background: linear-gradient(145deg, #ffdc4b, #ff9900);
    color: #754000;
    font-size: 85px;
    cursor: pointer;
    box-shadow: 0 10px 0 #b96a00;
    transition: 0.1s;
}

.coin:active {
    transform: scale(0.92);
    box-shadow: 0 3px 0 #b96a00;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.upgrade {
    width: 100%;
    padding: 17px;
    margin-top: 30px;
    background: #785cff;
    color: white;
    border-radius: 15px;
    font-size: 17px;
}

.upgrade:hover {
    background: #927cff;
}

.info {
    margin-top: 20px;
    color: #b9c2e8;
    line-height: 1.8;
}
</style>
</head>

<body>

<div class="container">

    <h1>🪙 COIN CLICKER</h1>

    <div class="balance">
        💰 <span id="coins">0</span>
    </div>

    <button class="coin" onclick="clickCoin()">
        🪙
    </button>

    <div class="info">
        ⚡ Сила клика: <span id="power">1</span><br>
        🏆 Всего заработано: <span id="total">0</span>
    </div>

    <button class="upgrade" onclick="buyUpgrade()">
        ⚡ УЛУЧШИТЬ КЛИК<br>
        Цена: <span id="price">50</span> монет
    </button>

</div>

<script>
let coins = Number(localStorage.getItem("coins")) || 0;
let power = Number(localStorage.getItem("power")) || 1;
let total = Number(localStorage.getItem("total")) || 0;

function save() {
    localStorage.setItem("coins", coins);
    localStorage.setItem("power", power);
    localStorage.setItem("total", total);
}

function update() {
    document.getElementById("coins").textContent = coins;
    document.getElementById("power").textContent = power;
    document.getElementById("total").textContent = total;
    document.getElementById("price").textContent = power * 50;
}

function clickCoin() {
    coins += power;
    total += power;
    save();
    update();
}

function buyUpgrade() {
    let price = power * 50;

    if (coins >= price) {
        coins -= price;
        power += 1;
        save();
        update();
    } else {
        alert("❌ Недостаточно монет!");
    }
}

update();
</script>

</body>
</html>
