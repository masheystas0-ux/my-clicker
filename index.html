<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Clicker Pro</title>
    <style>
        :root {
            --bg-color: #0a0f18; /* Очень темный, почти черный синий */
            --ice-blue: #00d2ff;
            --deep-blue: #0055ff;
            --text-color: #ffffff;
            --star-gold: #ffcc00;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            
            /* Неоновые узоры на фоне */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 210, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 85, 255, 0.08), transparent 25%);
            background-size: 100% 100%;
        }

        /* --- ЛЕДЯНЫЕ ПОЛОСКИ ПО КРАЯМ С ЛАМПОЧКАМИ --- */
        .ice-edge {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 15px;
            background: linear-gradient(to bottom, #00d2ff, #0055ff, #00d2ff);
            box-shadow: 0 0 15px var(--ice-blue);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        .ice-edge.left { left: 0; border-right: 2px solid #fff; }
        .ice-edge.right { right: 0; border-left: 2px solid #fff; }

        /* Лампочки на полосках */
        .bulb {
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--ice-blue);
            animation: blink 2s infinite alternate;
        }

        /* Задержка мигания для разных лампочек */
        .bulb:nth-child(even) { animation-delay: 1s; }
        
        @keyframes blink {
            0% { opacity: 0.3; box-shadow: 0 0 5px #fff; }
            100% { opacity: 1; box-shadow: 0 0 15px #fff, 0 0 25px var(--ice-blue); }
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ (ЭНЕРГИЯ) --- */
        .top-bar {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .energy-container {
            width: 80%;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            height: 22px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--ice-blue);
        }

        .energy-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #0055ff, #00d2ff);
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--ice-blue);
        }

        .energy-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        /* --- СЧЕТЧИК ЗВЕЗД --- */
        .score-container {
            margin-top: 10px;
            text-align: center;
            z-index: 10;
        }

        .score-title {
            font-size: 14px;
            color: var(--ice-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 5px var(--ice-blue);
        }

        .score {
            font-size: 48px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Монетка в форме звезды (через SVG) */
        .coin-star {
            width: 50px;
            height: 50px;
            filter: drop-shadow(0 0 10px var(--star-gold));
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- КНОПКА КЛИКА --- */
        .click-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .click-btn {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #1a2a40 0%, #0a0f18 100%);
            border: 3px solid var(--ice-blue);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2), inset 0 0 20px rgba(0, 210, 255, 0.2);
            transition: transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            position: relative;
        }

        .click-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.6), inset 0 0 30px rgba(0, 210, 255, 0.6);
        }

        .floating-text {
            position: absolute;
            color: var(--star-gold);
            font-size: 24px;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 5px var(--star-gold);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-menu {
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            background: #0d131f;
            border-top: 1px solid var(--deep-blue);
            z-index: 20;
        }

        .menu-item {
            text-align: center;
            font-size: 14px;
            color: #556;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        
        .menu-item.active {
            color: var(--ice-blue);
            text-shadow: 0 0 10px var(--ice-blue);
        }

        /* --- МОДАЛЬНОЕ ОКНО АПГРЕЙДОВ --- */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #0a0f18;
            border: 2px solid var(--ice-blue);
            border-radius: 15px;
            width: 85%;
            max-width: 350px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
        }

        .modal-title {
            text-align: center;
            color: var(--ice-blue);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .upgrade-item {
            background: #131a26;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid var(--deep-blue);
        }

        .upgrade-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .upgrade-desc {
            font-size: 12px;
            color: #889;
            margin-bottom: 10px;
        }

        .buy-upgrade-btn {
            width: 100%;
            padding: 10px;
            background: var(--ice-blue);
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .buy-upgrade-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px var(--ice-blue);
        }

        .buy-upgrade-btn:disabled {
            background: #334;
            color: #667;
            cursor: not-allowed;
            box-shadow: none;
        }

        .close-modal {
            display: block;
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #889;
            border: 1px solid #445;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Ледяные полоски с лампочками -->
    <div class="ice-edge left">
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
    </div>
    <div class="ice-edge right">
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
    </div>

    <!-- Энергия -->
    <div class="top-bar">
        <div class="energy-container">
            <div class="energy-bar" id="energyBar"></div>
            <div class="energy-text" id="energyText">1000 / 1000</div>
        </div>
    </div>

    <!-- Звезды -->
    <div class="score-container">
        <div class="score-title">Звездный баланс</div>
        <div class="score">
            <!-- SVG-звезда внутри круга -->
            <svg class="coin-star" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Круг монеты -->
                <circle cx="50" cy="50" r="45" fill="#111" stroke="#ffcc00" stroke-width="4"/>
                <!-- Звезда внутри -->
                <polygon points="50,15 61,40 88,40 66,57 74,85 50,68 26,85 34,57 12,40 39,40" fill="#ffcc00"/>
            </svg>
            <span id="score">0</span>
        </div>
    </div>

    <!-- Кнопка клика -->
    <div class="click-area" id="clickArea">
        <button class="click-btn" id="clickBtn">
            ⭐
        </button>
    </div>

    <!-- Меню -->
    <div class="bottom-menu">
        <div class="menu-item active" id="tabClick">Тапать</div>
        <div class="menu-item" id="tabUpgrade">Апгрейды</div>
        <div class="menu-item">Друзья</div>
    </div>

    <!-- Окно Апгрейдов -->
    <div class="modal" id="upgradeModal">
        <div class="modal-content">
            <h2 class="modal-title">Магазин Апгрейдов</h2>
            
            <div class="upgrade-item">
                <div class="upgrade-title">Усиление клика (Ур. <span id="lvlClick">1</span>)</div>
                <div class="upgrade-desc">Дает +1 звезду за тап.</div>
                <button class="buy-upgrade-btn" id="btnUpgradeClick">Улучшить (Цена: 100)</button>
            </div>

            <div class="upgrade-item" style="border-left-color: #ffcc00;">
                <div class="upgrade-title">🤖 Бот-фермер</div>
                <div class="upgrade-desc">Автоматически фармит 1 звезду в секунду. Работает в фоне!</div>
                <button class="buy-upgrade-btn" id="btnBuyBot" style="background: #ffcc00;">Купить бота (50 000)</button>
            </div>

            <button class="close-modal" id="closeModal">Закрыть</button>
        </div>
    </div>

    <script>
        // --- ДАННЫЕ ИГРЫ ---
        let score = localStorage.getItem('starClickerScore') ? parseInt(localStorage.getItem('starClickerScore')) : 0;
        let maxEnergy = 1000;
        let energy = maxEnergy;
        let clickPower = 1; 
        let clickUpgradeCost = 100;
        let clickLevel = 1;
        let hasBot = localStorage.getItem('starClickerBot') === 'true';

        // Элементы
        const scoreEl = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');
        const clickArea = document.getElementById('clickArea');
        const energyBar = document.getElementById('energyBar');
        const energyText = document.getElementById('energyText');
        
        // Модалка
        const modal = document.getElementById('upgradeModal');
        const tabClick = document.getElementById('tabClick');
        const tabUpgrade = document.getElementById('tabUpgrade');
        const closeModal = document.getElementById('closeModal');
        const btnUpgradeClick = document.getElementById('btnUpgradeClick');
        const btnBuyBot = document.getElementById('btnBuyBot');
        const lvlClickEl = document.getElementById('lvlClick');

        // Инициализация
        scoreEl.innerText = score;
        lvlClickEl.innerText = clickLevel;
        updateEnergy();
        checkBotStatus();

        // --- ЛОГИКА КЛИКА ---
        clickBtn.addEventListener('click', (e) => {
            if (energy >= 10) {
                energy -= 10;
                score += clickPower;
                saveData();
                scoreEl.innerText = score;
                updateEnergy();
                createFloatingText(e.clientX, e.clientY);
            } else {
                clickBtn.style.borderColor = "#ff0000";
                setTimeout(() => clickBtn.style.borderColor = "var(--ice-blue)", 500);
            }
        });

        // --- БОТ (ПАССИВНЫЙ ФАРМ) ---
        setInterval(() => {
            if (hasBot) {
                score += 1;
                scoreEl.innerText = score;
                saveData();
            }
        }, 1000);

        // --- ВОССТАНОВЛЕНИЕ ЭНЕРГИИ ---
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 5;
                if (energy > maxEnergy) energy = maxEnergy;
                updateEnergy();
            }
        }, 1000);

        // --- МАГАЗИН (МОДАЛКА) ---
        tabUpgrade.addEventListener('click', () => {
            modal.style.display = 'flex';
            tabUpgrade.classList.add('active');
            tabClick.classList.remove('active');
            updateUpgradeButtons();
        });

        tabClick.addEventListener('click', () => {
            modal.style.display = 'none';
            tabClick.classList.add('active');
            tabUpgrade.classList.remove('active');
        });

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
            tabClick.classList.add('active');
            tabUpgrade.classList.remove('active');
        });

        // --- ПОКУПКА УЛУЧШЕНИЙ ---
        btnUpgradeClick.addEventListener('click', () => {
            if (score >= clickUpgradeCost) {
                score -= clickUpgradeCost;
                clickLevel++;
                clickPower++;
                clickUpgradeCost = Math.floor(clickUpgradeCost * 2.5); // Усложняем следующий апгрейд
                
                saveData();
                updateUI();
                updateUpgradeButtons();
            }
        });

        btnBuyBot.addEventListener('click', () => {
            if (score >= 50000 && !hasBot) {
                score -= 50000;
                hasBot = true;
                localStorage.setItem('starClickerBot', 'true');
                saveData();
                updateUI();
                updateUpgradeButtons();
                alert("🤖 Бот-фермер куплен! Теперь он крадет 1 звезду в секунду для тебя.");
            }
        });

        // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
        function saveData() {
            localStorage.setItem('starClickerScore', score);
        }

        function updateUI() {
            scoreEl.innerText = score;
            lvlClickEl.innerText = clickLevel;
            btnUpgradeClick.innerText = `Улучшить (Цена: ${clickUpgradeCost})`;
            if (hasBot) {
                btnBuyBot.innerText = "Бот уже куплен";
                btnBuyBot.disabled = true;
            }
        }

        function updateUpgradeButtons() {
            btnUpgradeClick.disabled = score < clickUpgradeCost;
            if (!hasBot) {
                btnBuyBot.disabled = score < 50000;
            }
        }

        function checkBotStatus() {
            if (hasBot) {
                btnBuyBot.innerText = "Бот уже куплен";
                btnBuyBot.disabled = true;
            }
        }

        function updateEnergy() {
            const percent = (energy / maxEnergy) * 100;
            energyBar.style.width = percent + '%';
            energyText.innerText = `${Math.floor(energy)} / ${maxEnergy}`;
        }

        function createFloatingText(x, y) {
            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = `+${clickPower}`;
            text.style.left = x + 'px';
            text.style.top = y + 'px';
            text.style.transform = `translate(${Math.random() * 40 - 20}px, ${Math.random() * 40 - 20}px)`;
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 1000);
        }
    </script>
</body>
</html>
