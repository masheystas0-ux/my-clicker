<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дурак против Бота</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #1a472a; /* Зеленое сукно */
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Верхняя панель (Козырь и Колода) */
        #top-bar {
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background: rgba(0,0,0,0.3);
        }

        .deck-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-weight: bold;
        }

        /* Карты */
        .card {
            width: 50px;
            height: 75px;
            background: white;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            position: relative;
            transition: transform 0.2s;
        }

        .card.red { color: #d32f2f; }
        .card.black { color: #000; }

        .card-back {
            width: 50px;
            height: 75px;
            background: repeating-linear-gradient(45deg, #b71c1c, #b71c1c 5px, #880e4f 5px, #880e4f 10px);
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            border: 2px solid white;
        }

        /* Игровые зоны */
        #game-board {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        /* Рука бота (сверху) */
        #bot-hand {
            display: flex;
            justify-content: center;
            gap: -20px; /* Наложение карт */
            height: 80px;
            margin-top: 10px;
        }
        #bot-hand .card {
            margin-left: -25px; /* Эффект веера */
        }

        /* Зона стола (куда кладутся карты) */
        #table-zone {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 10px;
            padding: 10px;
        }

        .table-card {
            width: 50px;
            height: 75px;
            background: white;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            position: relative;
        }
        .table-card.beaten {
            transform: rotate(15deg);
            margin-top: -10px;
            margin-left: -20px;
        }

        /* Рука игрока (снизу) */
        #player-hand {
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding: 10px 0;
            min-height: 100px;
            gap: 5px;
        }

        #player-hand .card {
            flex-shrink: 0;
            cursor: pointer;
        }

        #player-hand .card:hover {
            transform: translateY(-10px);
        }

        /* Кнопки управления */
        #controls {
            display: flex;
            justify-content: space-around;
            padding: 10px 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            background: rgba(0,0,0,0.5);
        }

        button {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
        }
        button:disabled {
            background: #555;
            color: #888;
        }
        #btn-take {
            background: #f44336;
        }

        /* Статус */
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Верхняя панель -->
    <div id="top-bar">
        <div class="deck-info" id="deck-count">Колода: 0</div>
        <div class="deck-info" id="trump-info">Козырь: </div>
    </div>

    <!-- Игровое поле -->
    <div id="game-board">
        <div id="bot-hand"></div>
        <div id="table-zone"></div>
        <div id="player-hand"></div>
        <div id="status"></div>
    </div>

    <!-- Кнопки -->
    <div id="controls">
        <button id="btn-take" style="display: none;">Взять карты</button>
        <button id="btn-pass" style="display: none;">Пас (Бито)</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // --- Игровая логика ---
        const suits = ['♠', '♥', '♦', '♣'];
        const ranks = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
        let deck = [];
        let playerHand = [];
        let botHand = [];
        let table = []; // { attack: card, defend: card or null }
        let trumpSuit = '';
        let turn = 'player'; // 'player' или 'bot'
        let gameOver = false;

        // --- Создание колоды ---
        function createDeck() {
            deck = [];
            for (let suit of suits) {
                for (let rank of ranks) {
                    deck.push({ suit, rank, value: ranks.indexOf(rank) });
                }
            }
            // Перемешиваем
            deck.sort(() => Math.random() - 0.5);
        }

        // --- Раздача ---
        function dealCards() {
            for (let i = 0; i < 6; i++) {
                if (deck.length > 0) playerHand.push(deck.pop());
                if (deck.length > 0) botHand.push(deck.pop());
            }
            // Сортируем руки
            playerHand.sort((a, b) => a.value - b.value);
            botHand.sort((a, b) => a.value - b.value);
        }

        // --- Инициализация игры ---
        function startGame() {
            createDeck();
            dealCards();
            trumpSuit = deck[0].suit; // Последняя карта в колоде - козырь
            document.getElementById('trump-info').innerHTML = `Козырь: <span class="${trumpSuit === '♥' || trumpSuit === '♦' ? 'red' : 'black'}">${trumpSuit}</span>`;
            
            // Кто ходит первым (у кого младший козырь)
            let playerMinTrump = playerHand.find(c => c.suit === trumpSuit);
            let botMinTrump = botHand.find(c => c.suit === trumpSuit);
            
            if (!playerMinTrump && botMinTrump) turn = 'bot';
            else if (playerMinTrump && !botMinTrump) turn = 'player';
            else if (playerMinTrump && botMinTrump) {
                turn = playerMinTrump.value < botMinTrump.value ? 'player' : 'bot';
            } else {
                turn = 'player'; // Если козырей нет ни у кого
            }

            render();
            if (turn === 'bot') botAttack();
        }

        // --- Отрисовка ---
        function render() {
            // Обновляем колоду
            document.getElementById('deck-count').textContent = `Колода: ${deck.length}`;

            // Отрисовка руки бота
            const botHandDiv = document.getElementById('bot-hand');
            botHandDiv.innerHTML = '';
            botHand.forEach(() => {
                let cardDiv = document.createElement('div');
                cardDiv.className = 'card-back';
                botHandDiv.appendChild(cardDiv);
            });

            // Отрисовка стола
            const tableDiv = document.getElementById('table-zone');
            tableDiv.innerHTML = '';
            table.forEach(pair => {
                // Атакующая карта
                let atk = createCardElement(pair.attack, false);
                if (pair.defend) {
                    atk.classList.add('beaten');
                }
                tableDiv.appendChild(atk);

                // Защищающая карта (поверх)
                if (pair.defend) {
                    let def = createCardElement(pair.defend, false);
                    def.style.position = 'absolute';
                    def.style.transform = 'rotate(15deg)';
                    def.style.marginTop = '-10px';
                    atk.appendChild(def);
                }
            });

            // Отрисовка руки игрока
            const playerHandDiv = document.getElementById('player-hand');
            playerHandDiv.innerHTML = '';
            playerHand.forEach((card, index) => {
                let cardEl = createCardElement(card, true);
                cardEl.onclick = () => playerPlayCard(index);
                playerHandDiv.appendChild(cardEl);
            });

            // Обновление кнопок
            const btnTake = document.getElementById('btn-take');
            const btnPass = document.getElementById('btn-pass');
            
            if (turn === 'player') {
                if (table.length > 0 && table.every(p => p.defend)) {
                    btnPass.style.display = 'block'; // Можно сказать "Бито"
                } else if (table.length > 0 && !table.every(p => p.defend)) {
                    btnTake.style.display = 'block'; // Можно взять
                }
            } else {
                btnTake.style.display = 'none';
                btnPass.style.display = 'none';
            }
        }

        function createCardElement(card, isPlayer) {
            let div = document.createElement('div');
            div.className = `card ${card.suit === '♥' || card.suit === '♦' ? 'red' : 'black'}`;
            div.innerHTML = `${card.rank}<br>${card.suit}`;
            return div;
        }

        // --- Ход игрока ---
        function playerPlayCard(index) {
            if (turn !== 'player' || gameOver) return;
            let card = playerHand[index];
            
            // Если стол пуст - это атака
            if (table.length === 0) {
                table.push({ attack: card, defend: null });
                playerHand.splice(index, 1);
                turn = 'bot';
                render();
                setTimeout(botDefend, 1000); // Бот думает
                return;
            }

            // Если есть неотбитые карты - это защита
            let lastUnbeaten = table.find(p => !p.defend);
            if (lastUnbeaten) {
                if (canBeat(card, lastUnbeaten.attack)) {
                    lastUnbeaten.defend = card;
                    playerHand.splice(index, 1);
                    render();
                    
                    // Проверка, может ли бот еще подкинуть
                    setTimeout(botAttack, 1000);
                } else {
                    alert("Этой картой нельзя отбиться!");
                }
                return;
            }
            
            // Если все отбито - игрок может подкинуть карту того же ранга
            if (table.every(p => p.defend)) {
                let allowedRanks = table.map(p => p.attack.rank).concat(table.filter(p=>p.defend).map(p=>p.defend.rank));
                if (allowedRanks.includes(card.rank)) {
                    table.push({ attack: card, defend: null });
                    playerHand.splice(index, 1);
                    turn = 'bot';
                    render();
                    setTimeout(botDefend, 1000);
                } else {
                    alert("Можно подкидывать только карты тех рангов, которые уже есть на столе!");
                }
            }
        }

        // --- Логика Бота ---
        function botAttack() {
            if (gameOver) return;
            
            // Бот атакует первой картой
            if (table.length === 0 && botHand.length > 0) {
                // Сортируем так, чтобы ходить младшими
                botHand.sort((a,b) => a.value - b.value);
                let card = botHand.shift();
                table.push({ attack: card, defend: null });
                turn = 'player';
                render();
            } else {
                // Бот пытается подкинуть, если может
                let allowedRanks = table.map(p => p.attack.rank).concat(table.filter(p=>p.defend).map(p=>p.defend.rank));
                let cardToAdd = botHand.find(c => allowedRanks.includes(c.rank));
                
                if (cardToAdd && table.length < 6) {
                    let idx = botHand.indexOf(cardToAdd);
                    botHand.splice(idx, 1);
                    table.push({ attack: cardToAdd, defend: null });
                    turn = 'player';
                    render();
                } else {
                    // Бот не может подкинуть, заканчиваем раунд
                    endRound();
                }
            }
        }

        function botDefend() {
            if (gameOver) return;
            let unbeaten = table.find(p => !p.defend);
            if (!unbeaten) return;

            let attackCard = unbeaten.attack;
            
            // Ищем карту, которой можно отбиться
            let defendCard = botHand.find(c => canBeat(c, attackCard));
            
            if (defendCard) {
                let idx = botHand.indexOf(defendCard);
                botHand.splice(idx, 1);
                unbeaten.defend = defendCard;
                render();
                // После отбития, бот может попробовать подкинуть (или игрок должен подкинуть)
                turn = 'player';
                render();
            } else {
                // Бот не может отбиться - забирает карты
                setTimeout(() => {
                    botTakeCards();
                }, 500);
            }
        }

        function botTakeCards() {
            table.forEach(pair => {
                botHand.push(pair.attack);
                if (pair.defend) botHand.push(pair.defend);
            });
            table = [];
            // Бот сходил - ход переходит к игроку
            turn = 'player';
            render();
            checkEndGame();
        }

        // --- Вспомогательные функции ---
        function canBeat(defendCard, attackCard) {
            if (defendCard.suit === attackCard.suit && defendCard.value > attackCard.value) return true; // Старшая той же масти
            if (defendCard.suit === trumpSuit && attackCard.suit !== trumpSuit) return true; // Козырь бьет не козырь
            return false;
        }

        function endRound() {
            table = [];
            // Добираем карты из колоды
            while (playerHand.length < 6 && deck.length > 0) playerHand.push(deck.pop());
            while (botHand.length < 6 && deck.length > 0) botHand.push(deck.pop());
            
            playerHand.sort((a, b) => a.value - b.value);
            botHand.sort((a, b) => a.value - b.value);
            
            // Ход переходит к тому, кто отбился
            turn = turn === 'bot' ? 'player' : 'bot'; // Для простоты
            render();
            checkEndGame();
        }

        function checkEndGame() {
            if (playerHand.length === 0 && deck.length === 0) {
                gameOver = true;
                showStatus("Вы выиграли! 🎉");
            } else if (botHand.length === 0 && deck.length === 0) {
                gameOver = true;
                showStatus("Вы проиграли! 😢 Бот вышел.");
            }
        }

        function showStatus(text) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = text;
            statusDiv.style.display = 'block';
        }

        // --- Кнопки ---
        document.getElementById('btn-take').onclick = () => {
            if (turn !== 'player') return;
            // Игрок забирает карты
            table.forEach(pair => {
                playerHand.push(pair.attack);
                if (pair.defend) playerHand.push(pair.defend);
            });
            table = [];
            turn = 'bot';
            render();
            setTimeout(botAttack, 1000);
        };

        document.getElementById('btn-pass').onclick = () => {
            if (turn !== 'player') return;
            // Игрок говорит "Бито"
            endRound();
        };

        // Запуск игры
        startGame();
    </script>
</body>
</html>
