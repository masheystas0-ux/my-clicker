<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Кликер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100vh;
            background-image: url('bp.jpg.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            padding-bottom: 40px;
            box-sizing: border-box;
        }

        #score-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 40px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 2px solid #fff;
        }

        #score {
            font-size: 42px;
            font-weight: bold;
            color: #fff;
        }

        #click-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        
        #click-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="score-container">
        <div id="score">0</div>
    </div>
    
    <button id="click-btn">КЛИК</button>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let score = 0;
        const scoreElement = document.getElementById('score');
        const button = document.getElementById('click-btn');

        // 1. Функция загрузки прогресса из облака Telegram
        async function loadProgress() {
            if (tg && tg.CloudStorage) {
                try {
                    const savedScore = await tg.CloudStorage.getItem('clicker_score');
                    if (savedScore) {
                        score = parseInt(savedScore) || 0;
                        scoreElement.textContent = score;
                    }
                } catch (e) {
                    console.log('Ошибка загрузки прогресса:', e);
                }
            }
        }

        // 2. Функция сохранения прогресса в облако Telegram
        async function saveProgress() {
            if (tg && tg.CloudStorage) {
                try {
                    await tg.CloudStorage.setItem('clicker_score', score.toString());
                } catch (e) {
                    console.log('Ошибка сохранения прогресса:', e);
                }
            }
        }

        // 3. Обработчик клика
        button.addEventListener('click', () => {
            score++;
            scoreElement.textContent = score;
            
            if (tg) {
                tg.HapticFeedback.impactOccurred('light');
            }
            
            // Сохраняем результат после каждого клика
            saveProgress();
        });

        // 4. При запуске игры сразу загружаем сохраненный счетчик
        loadProgress();
    </script>
</body>
</html>
