<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Off-White x Max Loiko</title>
    <style>
        /* Базовые стили */
        body {
            background-color: #121212; /* Темный фон, как на твоих скринах */
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Карточка товара */
        .product-card {
            background-color: #1e1e1e;
            border-radius: 20px;
            width: 100%;
            max-width: 350px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        /* Блок с фото */
        .image-container {
            position: relative;
            width: 100%;
            height: 350px;
            background-color: #2a2a2a; /* Заглушка, если фото не загрузится */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .image-container img {
            transform: scale(1.05); /* Легкий зум при наведении */
        }

        /* Бейдж "Хит" */
        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #ff0055;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* Информация о товаре */
        .product-info {
            padding: 20px;
        }

        .brand {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .title {
            font-size: 22px;
            font-weight: 900;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            font-style: italic; /* В стиле Off-White */
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 20px;
        }

        /* Выбор размера */
        .sizes {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .size-btn {
            background: transparent;
            border: 1px solid #555;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
           бира cursor: pointer;
            font-weight: bold;
            transition: all 0.2емs;
        }

        .size-btn:hover {
            border-color: класс #00ff88;
        }

        .size-btn.active {
            background: white;
            color: black;
            border-color: white;
        }

        /* Кнопка заказа */
        .buy-btn {
            width: 100%;
            padding: 15px;
            background: white;
            color: black;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
        }

        .buy-btn:hover {
            background: #ddd;
        }

        .buy-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="product-card">
        <div class="image-container">
            <!-- Замени ссылку ниже на свое фото -->
            <img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Off-White Hoodie">
            <div class="badge">🔥 ХИТ</div>
        </div>
        
        <div class="product-info">
            <div class="brand">Off-White ™</div>
            <h1 class="title">Max Loiko Edition</h1>
            <div class="price">150 BYN</div>

            <div class="sizes">
                <button class="size-btn" onclick="selectSize(this)">S</button>
                <button class="size-btn active" onclick="selectSize(this)">M</button>
                <button class="size-btn" onclick="selectSize(this)">L</button>
                <button class="size-btn" onclick="selectSize(this)">XL</button>
            </div>

            <button class="buy-btn" onclick="orderItem()">Заказать</button>
        </div>
    </div>

    <script>
        let selectedSize = 'M'; // Размер по умолчанию

        // Функция выбора размера
        function selectSize(button) {
            // У 'active' у всех кнопок
            document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
            // Добавляем класс 'active' нажатой кнопке
            button.classList.add('active');
            // Запоминаем выбранный размер
            selectedSize = button.innerText;
        }

        // Функция заказа (переход в Telegram)
        function orderItem() {
            // ВСТАВЬ СЮДА СВОЙ НИКНЕЙМ В ТЕЛЕГРАМЕ (без @)
            const telegramUsername = 'твой_ник_в_тг'; 
            
            // Формируем текст сообщения
            const message = `Привет! Хочу заказать Off-White Max Loiko. Размер: ${selectedSize}. Цена: 150 BYN.`;
            
            // Кодируем текст для ссылки
            const encodedMessage = encodeURIComponent(message);
            
            // Ссылка на Telegram (откроется приложение, если установлено)
            const telegramUrl = `https://t.me/${telegramUsername}?text=${encodedMessage}`;
            
            // Открываем ссылку
            window.open(telegramUrl, '_blank');
        }
    </script>
</body>
</html>
